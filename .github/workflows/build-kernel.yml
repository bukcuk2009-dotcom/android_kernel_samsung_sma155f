name: Build KernelSU-Next (Final v6.1)

on:
  workflow_dispatch:
    inputs:
      ap_file:
        description: 'Tên file AP tar (để trống để tự động tìm)'
        required: false
        default: ''
      firmware_tag:
        description: 'Tag release chứa vendor_boot (VD: firmware-CYG3)'
        required: false
        default: 'firmware-CYG3'

permissions:
  contents: write

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.1.7
        with:
          ref: kernelsunext
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git bc bison flex libssl-dev make libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            python3 wget unzip lz4 tar zip \
            python-is-python3 ccache cpio rsync

      - name: Cache ccache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.1.2
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-v6.1-${{ hashFiles('kernel-5.10/arch/arm64/configs/a15_00_defconfig', 'kernel-5.10/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-ccache-v6.1-
            ${{ runner.os }}-ccache-

      - name: Setup toolchain
        run: |
          if [ -f toolchain.zip ]; then
            unzip -q toolchain.zip
            echo "Toolchain unzipped from repo"
          else
            echo "Using system apt toolchain"
          fi

      - name: Prepare boot and vendor_boot images
        run: |
          # Giải nén boot.img (có sẵn trong repo)
          if [ -f boot.img.lz4 ]; then
            lz4 -d -f boot.img.lz4 boot.img
            echo "Decompressed boot.img from lz4: $(stat -c%s boot.img) bytes"
          elif [ -f boot.img ]; then
            echo "boot.img already exists: $(stat -c%s boot.img) bytes"
          else
            echo "ERROR: No boot.img or boot.img.lz4 found!"
            exit 1
          fi

          # Giải nén vendor_boot.img (có sẵn trong repo)
          if [ -f vendor_boot.img.lz4 ]; then
            lz4 -d -f vendor_boot.img.lz4 vendor_boot.img
            echo "Decompressed vendor_boot.img from lz4: $(stat -c%s vendor_boot.img) bytes"
          elif [ -f vendor_boot.img ]; then
            echo "vendor_boot.img already exists: $(stat -c%s vendor_boot.img) bytes"
          else
            echo "WARNING: vendor_boot.img not found"
          fi

      - name: Patch defconfig for KernelSU-Next + SUSFS
        run: |
          DEF="kernel-5.10/arch/arm64/configs/a15_00_defconfig"
          CFG="./kernel-5.10/scripts/config"

          # --- Disable Samsung security features (theo README) ---
          $CFG --file "$DEF" \
            --set-val UH n \
            --set-val RKP n \
            --set-val KDP n \
            --set-val SECURITY_DEFEX n \
            --set-val INTEGRITY n \
            --set-val FIVE n \
            --set-val TRIM_UNUSED_KSYMS n \
            --set-val PROCA n \
            --set-val PROCA_GKI_10 n \
            --set-val PROCA_S_OS n \
            --set-val PROCA_CERTIFICATES_XATTR n \
            --set-val PROCA_CERT_ENG n \
            --set-val PROCA_CERT_USER n \
            --set-val GAF_V6 n \
            --set-val FIVE_CERT_USER n \
            --set-val FIVE_DEFAULT_HASH n \
            --set-val UH_RKP n \
            --set-val UH_LKMAUTH n \
            --set-val UH_LKM_BLOCK n \
            --set-val RKP_CFP_JOPP n \
            --set-val RKP_CFP n \
            --set-val KDP_CRED n \
            --set-val KDP_NS n \
            --set-val KDP_TEST n \
            --set-val RKP_CRED n

          # --- Kernel optimizations (theo README) ---
          $CFG --file "$DEF" \
            --set-val TMPFS_XATTR y \
            --set-val TMPFS_POSIX_ACL y \
            --set-val IP_NF_TARGET_TTL y \
            --set-val IP6_NF_TARGET_HL y \
            --set-val IP6_NF_MATCH_HL y \
            --set-val TCP_CONG_ADVANCED y \
            --set-val TCP_CONG_BBR y \
            --set-val NET_SCH_FQ y \
            --set-val TCP_CONG_BIC n \
            --set-val TCP_CONG_WESTWOOD n \
            --set-val TCP_CONG_HTCP n \
            --set-val DEFAULT_BBR y \
            --set-val DEFAULT_BIC n \
            --set-str DEFAULT_TCP_CONG "bbr" \
            --set-val DEFAULT_RENO n \
            --set-val DEFAULT_CUBIC n

          # --- KernelSU Next + SUSFS configs (theo README) ---
          $CFG --file "$DEF" \
            --set-val KSU_WITH_KPROBES n \
            --set-val KSU_SUSFS y \
            --set-val KSU_SUSFS_HAS_MAGIC_MOUNT y \
            --set-val KSU_SUSFS_SUS_PATH y \
            --set-val KSU_SUSFS_SUS_MOUNT y \
            --set-val KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT y \
            --set-val KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT y \
            --set-val KSU_SUSFS_SUS_KSTAT y \
            --set-val KSU_SUSFS_SUS_OVERLAYFS n \
            --set-val KSU_SUSFS_TRY_UMOUNT y \
            --set-val KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT y \
            --set-val KSU_SUSFS_SPOOF_UNAME y \
            --set-val KSU_SUSFS_ENABLE_LOG y \
            --set-val KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS y \
            --set-val KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG y \
            --set-val KSU_SUSFS_OPEN_REDIRECT y \
            --set-val KSU_SUSFS_SUS_SU n \
            --set-val KSU y

          # --- MODULES ---
          $CFG --file "$DEF" \
            --set-val MODULES y \
            --set-val MODULE_FORCE_LOAD y \
            --set-val MODULE_UNLOAD y \
            --set-val MODULE_FORCE_UNLOAD y

          # --- Disable incompatible drivers (từ kinh nghiệm) ---
          $CFG --file "$DEF" \
            --set-val BLK_DEV_SSG n \
            --set-val MTK_GED n \
            --set-val MTK_BLOCKTAG n \
            --set-val TZDEV n

          echo "=== Verifying key configs ==="
          grep -E "^(CONFIG_KSU|CONFIG_OVERLAY_FS|CONFIG_MODULES)" "$DEF" || true

      - name: Setup build environment
        run: |
          mkdir -p out/target/product/a15/obj/KERNEL_OBJ
          mkdir -p out/dist

          cd kernel-5.10
          # Theo README gốc: dùng python (không phải python3)
          python scripts/gen_build_config.py \
            --kernel-defconfig a15_00_defconfig \
            --kernel-defconfig-overlays "entry_level.config" \
            -m user \
            -o ../out/target/product/a15/obj/KERNEL_OBJ/build.config
          cd ..

      - name: Build kernel
        run: |
          export USE_CCACHE=1
          export CCACHE_DIR=$HOME/.ccache
          export PATH="/usr/lib/ccache:$PATH"
          ccache -M 4G

          # Theo README gốc
          export ARCH=arm64
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CROSS_COMPILE_COMPAT="arm-linux-gnueabi-"
          export OUT_DIR="$(pwd)/out/target/product/a15/obj/KERNEL_OBJ"
          export DIST_DIR="$(pwd)/out/target/product/a15/obj/KERNEL_OBJ"
          export BUILD_CONFIG="$(pwd)/out/target/product/a15/obj/KERNEL_OBJ/build.config"

          # KCFLAGS để suppress các warning GCC 11 (từ kinh nghiệm)
          export KCFLAGS="-Wno-error=format= -Wno-error=format-extra-args \
            -Wno-error=implicit-function-declaration -Wno-error=unused-function \
            -Wno-error=misleading-indentation -Wno-error=unused-label \
            -Wno-implicit-fallthrough -Wno-strict-prototypes \
            -Wno-error=stringop-overread -Wno-error=parentheses \
            -Wno-error=unused-variable -Wno-error=unused-result \
            -Wno-error=uninitialized -Wno-error=frame-larger-than= \
            -Wno-error=format-zero-length"

          echo "=== Patching source code ==="
          cd kernel-5.10
          
          # Fix swapfile.c — vendor hook không tồn tại
          sed -i '/android_oem_data1/s/^/\/\//' mm/swapfile.c
          grep -n "android_oem_data1" mm/swapfile.c || echo "swapfile.c patched OK"

          # Fix ssg-iosched.c — API không tương thích
          sed -i 's/rqi->blkg = blkg_lookup(css_to_blkcg(blkcg_css()), rq->q);/rqi->blkg = NULL; \/\/ samsung-api-removed/' \
            block/ssg-iosched.c
          if grep -n "css_to_blkcg\|blkcg_css" block/ssg-iosched.c | grep -v "//.*samsung-api-removed"; then
            echo "ERROR: Unpatched css_to_blkcg/blkcg_css remaining in ssg-iosched.c"
            exit 1
          else
            echo "ssg-iosched.c patched OK"
          fi

          # Fix zram_drv.c — Samsung vendor hooks
          sed -i "s/page->mem_cgroup->swappiness/0 \/* samsung-removed *\//g" \
            drivers/block/zram/zram_drv.c
          sed -i "s/page->mem_cgroup/NULL \/* samsung-removed *\//g" \
            drivers/block/zram/zram_drv.c
          sed -i "/\.android_oem_data1[[:space:]]*=/{s/^/\/\//}" \
            drivers/block/zram/zram_drv.c
          grep -n "page->mem_cgroup" drivers/block/zram/zram_drv.c \
            && echo "ERROR: zram still has mem_cgroup" && exit 1 \
            || echo "zram_drv.c patched OK"

          # Fix ged_kpi.c — thiếu header
          sed -i 's|#include "disp_arr.h"|// #include "disp_arr.h" // patched|' \
            drivers/gpu/mediatek/ged/src/ged_kpi.c
          echo "ged_kpi.c patched OK"

          # Blocktag — xóa khỏi Makefile + clear Makefile
          sed -i '/obj-\$(CONFIG_MTK_BLOCKTAG)/d' drivers/misc/mediatek/Makefile
          if [ -f drivers/misc/mediatek/blocktag/Makefile ]; then
            echo "# Patched: disabled" > drivers/misc/mediatek/blocktag/Makefile
            echo "blocktag/Makefile cleared"
          fi
          if [ -f drivers/misc/mediatek/blocktag/blocktag-index.c ]; then
            sed -i '/\.proc_compat_ioctl/s/^/\/\//' drivers/misc/mediatek/blocktag/blocktag-index.c
            echo "blocktag-index.c patched"
          fi

          # Fix apu-driver.c — duplicate devfreq_update_stats
          if [ -f drivers/misc/mediatek/apusys/power/2.5/common/apu-driver.c ]; then
            sed -i 's|#include.*devfreq/governor\.h.*|// & // patched|' \
              drivers/misc/mediatek/apusys/power/2.5/common/apu-driver.c
            echo "apu-driver.c patched"
          fi

          cd ..

          echo "=== Building kernel with build_kernel.sh ==="
          chmod +x build_kernel.sh
          ./build_kernel.sh

          ccache -s

      - name: Locate kernel Image
        run: |
          echo "=== Searching for Image / Image.gz ==="
          find out/ -name "Image*" 2>/dev/null | sort

          # Theo README: Image.gz nằm ở đây
          IMGPATH="out/target/product/a15/obj/KERNEL_OBJ/kernel-5.10/arch/arm64/boot"
          if [ -f "$IMGPATH/Image.gz" ]; then
            echo "KERNEL_IMAGE_PATH=$IMGPATH" >> $GITHUB_ENV
            echo "KERNEL_IMAGE_FILE=Image.gz" >> $GITHUB_ENV
          elif [ -f "$IMGPATH/Image" ]; then
            echo "KERNEL_IMAGE_PATH=$IMGPATH" >> $GITHUB_ENV
            echo "KERNEL_IMAGE_FILE=Image" >> $GITHUB_ENV
          else
            FOUND=$(find out/ -name "Image.gz" 2>/dev/null | head -1)
            [ -z "$FOUND" ] && FOUND=$(find out/ -name "Image" 2>/dev/null | head -1)
            [ -z "$FOUND" ] && echo "ERROR: Image not found!" && exit 1
            echo "KERNEL_IMAGE_PATH=$(dirname $FOUND)" >> $GITHUB_ENV
            echo "KERNEL_IMAGE_FILE=$(basename $FOUND)" >> $GITHUB_ENV
          fi

          _PATH=$(grep "^KERNEL_IMAGE_PATH=" "$GITHUB_ENV" | cut -d= -f2)
          _FILE=$(grep "^KERNEL_IMAGE_FILE=" "$GITHUB_ENV" | cut -d= -f2)
          ls -lh "$_PATH/$_FILE"

      - name: Inject kernel into repack workspace
        run: |
          mkdir -p kernel-5.10/arch/arm64/boot/
          SRC="$KERNEL_IMAGE_PATH/$KERNEL_IMAGE_FILE"

          if [ "$KERNEL_IMAGE_FILE" = "Image.gz" ]; then
            cp "$SRC" kernel-5.10/arch/arm64/boot/Image.gz
            gunzip -k -f kernel-5.10/arch/arm64/boot/Image.gz
            IMG_SIZE=$(stat -c%s kernel-5.10/arch/arm64/boot/Image 2>/dev/null || echo 0)
            if [ "$IMG_SIZE" -lt 1048576 ]; then
              echo "ERROR: Image suspiciously small (${IMG_SIZE} bytes)"
              exit 1
            fi
          else
            cp "$SRC" kernel-5.10/arch/arm64/boot/Image
            gzip -9 -c "$SRC" > kernel-5.10/arch/arm64/boot/Image.gz
          fi

          echo "Image:    $(stat -c%s kernel-5.10/arch/arm64/boot/Image 2>/dev/null || echo N/A) bytes"
          echo "Image.gz: $(stat -c%s kernel-5.10/arch/arm64/boot/Image.gz 2>/dev/null || echo N/A) bytes"

      - name: Repack boot image
        run: |
          if [ ! -f scripts/repack ]; then
            echo "ERROR: scripts/repack not found!"
            exit 1
          fi
          chmod +x scripts/repack
          ./scripts/repack
          echo "Repacked boot.img: $(stat -c%s boot.img) bytes"
          file boot.img
          file boot.img | grep -qiE "android bootimg|android boot image" || \
            { echo "ERROR: boot.img invalid format!"; exit 1; }
          echo "boot.img format OK"

      - name: Create Odin flashable tar
        run: |
          if [ -f vendor_boot.img ]; then
            tar -cvf KSU-Next-A155F.tar boot.img vendor_boot.img
          else
            tar -cvf KSU-Next-A155F.tar boot.img
          fi
          echo "KSU-Next-A155F.tar: $(stat -c%s KSU-Next-A155F.tar) bytes"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: boot-KSU-Next-CYG3-v6-${{ github.run_number }}
          path: |
            boot.img
            vendor_boot.img
            KSU-Next-A155F.tar
          if-no-files-found: warn
          retention-days: 7

      - name: Create Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631  # v2.x
        with:
          tag_name: KSU-Next-CYG3-v${{ github.run_number }}-${{ github.run_attempt }}
          name: "KernelSU-Next A155F CYG3 — Build #${{ github.run_number }} (attempt ${{ github.run_attempt }})"
          body: |
            ## KernelSU-Next cho SM-A155F — Final v6.1

            **Firmware gốc tương thích:** A155FXXS7CYG3

            ### Thay đổi trong v6.1:
            - ✅ Tích hợp đầy đủ KSU-Next + SUSFS từ README gốc
            - ✅ Dùng `build_kernel.sh` (theo hướng dẫn)
            - ✅ Tất cả bản vá source và KCFLAGS từ 30+ lần chạy
            - ✅ Disable driver không tương thích (blocktag, apusys, tzdev...)

            ### Lưu ý trước khi flash:
            > ⚠️ Đảm bảo đã vô hiệu hóa `dm-verity` (flash `vbmeta` với `--disable-verity`)

            ### Hướng dẫn flash:
            > **Odin:** Chọn `AP` → nạp `KSU-Next-A155F.tar`
            > **Fastboot:** flash `boot.img` → `boot`, `vendor_boot.img` → `vendor_boot`
          files: |
            boot.img
            vendor_boot.img
            KSU-Next-A155F.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
